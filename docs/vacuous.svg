<svg xmlns="http://www.w3.org/2000/svg" width="708" height="672" viewBox="0 0 708 672" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" role="img" aria-label="the gates went green and proved nothing">
  <style>
    .l { opacity: 0; animation-duration: 8.40s;
         animation-timing-function: linear; animation-iteration-count: infinite; }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
    }
  </style>
  <rect width="100%" height="100%" rx="10" fill="#11141a"/>
  <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="43" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="20" r="5.5" fill="#28c840"/>
  <text x="354" y="24" fill="#7d8590" font-size="11" text-anchor="middle">the gates went green and proved nothing</text>
  <g>
        <text class="l l0" x="18" y="54" xml:space="preserve" fill="#56b6c2">$ wring run</text>
    <text class="l l1" x="18" y="74" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l2" x="18" y="94" xml:space="preserve" fill="#7d8590">iteration 1/3</text>
    <text class="l l3" x="18" y="114" xml:space="preserve" fill="#f85149">✗ test failed        0.1s</text>
    <text class="l l4" x="18" y="134" xml:space="preserve" fill="#7d8590">→ worker             0.0s  (exit 0)</text>
    <text class="l l5" x="18" y="154" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l6" x="18" y="174" xml:space="preserve" fill="#7d8590">iteration 2/3</text>
    <text class="l l7" x="18" y="194" xml:space="preserve" fill="#3fb950">✓ test passed        0.1s</text>
    <text class="l l8" x="18" y="214" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l9" x="18" y="234" xml:space="preserve" fill="#d7dae0">Converged in 2 iterations.</text>
    <text class="l l10" x="18" y="254" xml:space="preserve" fill="#d7dae0">Loop evidence: .wringer/loops/20260806-205728-7d39/</text>
    <text class="l l11" x="18" y="274" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l12" x="18" y="294" xml:space="preserve" fill="#56b6c2">$ wring verify --prove</text>
    <text class="l l13" x="18" y="314" xml:space="preserve" fill="#3fb950">✓ test passed        0.1s</text>
    <text class="l l14" x="18" y="334" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l15" x="18" y="354" xml:space="preserve" fill="#d7dae0">! every required gate passed without the change too (test), so they proved</text>
    <text class="l l16" x="18" y="374" xml:space="preserve" fill="#d7dae0">  nothing about it — write a test that fails without your change</text>
    <text class="l l17" x="18" y="394" xml:space="preserve" fill="#d7dae0">  Both trees&#x27; output: .wringer/runs/20260806-205729-e3a5/vacuity/</text>
    <text class="l l18" x="18" y="414" xml:space="preserve" fill="#d7dae0">  `wring deliver` will refuse this bundle.</text>
    <text class="l l19" x="18" y="434" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l20" x="18" y="454" xml:space="preserve" fill="#d7dae0">Evidence written to:</text>
    <text class="l l21" x="18" y="474" xml:space="preserve" fill="#d7dae0">.wringer/runs/20260806-205729-e3a5/</text>
    <text class="l l22" x="18" y="494" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l23" x="18" y="514" xml:space="preserve" fill="#56b6c2">$ wring deliver</text>
    <text class="l l24" x="18" y="534" xml:space="preserve" fill="#d7dae0">wring deliver: refusing to deliver 20260806-205729-e3a5 — it recorded</text>
    <text class="l l25" x="18" y="554" xml:space="preserve" fill="#d7dae0">`gates_vacuous`. `test` passed on the pre-change tree too, so they proved</text>
    <text class="l l26" x="18" y="574" xml:space="preserve" fill="#d7dae0">nothing about this change. The fix is to write a test that fails without your</text>
    <text class="l l27" x="18" y="594" xml:space="preserve" fill="#d7dae0">change, then verify again; both trees&#x27; output is in</text>
    <text class="l l28" x="18" y="614" xml:space="preserve" fill="#d7dae0">20260806-205729-e3a5/vacuity/ if you want to see why. There is no flag for</text>
    <text class="l l29" x="18" y="634" xml:space="preserve" fill="#d7dae0">this — make the evidence better, not the check weaker</text>
  </g>
