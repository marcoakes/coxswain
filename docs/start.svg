<svg xmlns="http://www.w3.org/2000/svg" width="708" height="1272" viewBox="0 0 708 1272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" role="img" aria-label="wring start — preflight, gates, agent, receipt">
  <style>
    .l { opacity: 0; animation-duration: 3.40s;
         animation-timing-function: linear; animation-iteration-count: infinite; }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
    }
  </style>
  <rect width="100%" height="100%" rx="10" fill="#11141a"/>
  <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="43" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="20" r="5.5" fill="#28c840"/>
  <text x="354" y="24" fill="#7d8590" font-size="11" text-anchor="middle">wring start — preflight, gates, agent, receipt</text>
  <g>
        <text class="l l0" x="18" y="54" xml:space="preserve" fill="#56b6c2">$ wring start --accept-gates --agent claude-code</text>
    <text class="l l1" x="18" y="74" xml:space="preserve" fill="#d7dae0">wring start — set this up and start your first build</text>
    <text class="l l2" x="18" y="94" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l3" x="18" y="114" xml:space="preserve" fill="#d7dae0">[1/7] preflight</text>
    <text class="l l4" x="18" y="134" xml:space="preserve" fill="#3fb950">✓ python                Python 3.12.13</text>
    <text class="l l5" x="18" y="154" xml:space="preserve" fill="#3fb950">✓ wring                 wring 0.3.0 at …sers/marc/Claude/wringer/.venv/bin/wring</text>
    <text class="l l6" x="18" y="174" xml:space="preserve" fill="#3fb950">✓ git                   git version 2.50.1 (Apple Git-155)</text>
    <text class="l l7" x="18" y="194" xml:space="preserve" fill="#d7dae0">! container runtime     no container runtime found (Apple silicon detected)</text>
    <text class="l l8" x="18" y="214" xml:space="preserve" fill="#3fb950">✓ git repository        /private/var/fo…951kn9bfs540fq17gw0000gn/T/wringer-start</text>
    <text class="l l9" x="18" y="234" xml:space="preserve" fill="#d7dae0">! gates                 no .wringer.yaml here yet</text>
    <text class="l l10" x="18" y="254" xml:space="preserve" fill="#3fb950">✓ workspace writable    /private/var/fo…0gn/T/wringer-start/.wringer is writable</text>
    <text class="l l11" x="18" y="274" xml:space="preserve" fill="#3fb950">✓ llm key               set: ANTHROPIC_API_KEY (value not shown)</text>
    <text class="l l12" x="18" y="294" xml:space="preserve" fill="#d7dae0">  (the ! lines are optional extras — `wring doctor` explains them)</text>
    <text class="l l13" x="18" y="314" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l14" x="18" y="334" xml:space="preserve" fill="#d7dae0">[2/7] workspace</text>
    <text class="l l15" x="18" y="354" xml:space="preserve" fill="#d7dae0">  not declared — nothing here needs one yet. `wring get` will ask</text>
    <text class="l l16" x="18" y="374" xml:space="preserve" fill="#d7dae0">  for one before it clones.</text>
    <text class="l l17" x="18" y="394" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l18" x="18" y="414" xml:space="preserve" fill="#d7dae0">[3/7] repo</text>
    <text class="l l19" x="18" y="434" xml:space="preserve" fill="#d7dae0">  /private/var/folders/n8/bx4t2r951kn9bfs540fq17gw0000gn/T/wringer-start</text>
    <text class="l l20" x="18" y="454" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l21" x="18" y="474" xml:space="preserve" fill="#d7dae0">[4/7] gates</text>
    <text class="l l22" x="18" y="494" xml:space="preserve" fill="#d7dae0">  detected from a Python layout: test</text>
    <text class="l l23" x="18" y="514" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l24" x="18" y="534" xml:space="preserve" fill="#d7dae0">[5/7] agent</text>
    <text class="l l25" x="18" y="554" xml:space="preserve" fill="#3fb950">  ✓ claude-code   /var/folders/n8/bx4t2…00gn/T/wringer-start-bin/claude-code-acp</text>
    <text class="l l26" x="18" y="574" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l27" x="18" y="594" xml:space="preserve" fill="#d7dae0">  This is what will be added:</text>
    <text class="l l28" x="18" y="614" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l29" x="18" y="634" xml:space="preserve" fill="#d7dae0">    run:</text>
    <text class="l l30" x="18" y="654" xml:space="preserve" fill="#d7dae0">      worker:</text>
    <text class="l l31" x="18" y="674" xml:space="preserve" fill="#d7dae0">        acp:</text>
    <text class="l l32" x="18" y="694" xml:space="preserve" fill="#d7dae0">          command: claude-code-acp</text>
    <text class="l l33" x="18" y="714" xml:space="preserve" fill="#d7dae0">          env_passthrough:</text>
    <text class="l l34" x="18" y="734" xml:space="preserve" fill="#d7dae0">          - ANTHROPIC_API_KEY</text>
    <text class="l l35" x="18" y="754" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l36" x="18" y="774" xml:space="preserve" fill="#d7dae0">[6/7] key</text>
    <text class="l l37" x="18" y="794" xml:space="preserve" fill="#d7dae0">  ANTHROPIC_API_KEY is already set here (value not shown).</text>
    <text class="l l38" x="18" y="814" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l39" x="18" y="834" xml:space="preserve" fill="#d7dae0">Wrote .wringer.yaml.</text>
    <text class="l l40" x="18" y="854" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l41" x="18" y="874" xml:space="preserve" fill="#d7dae0">Wringer stored nothing. .wringer.yaml records the NAME ANTHROPIC_API_KEY, never</text>
    <text class="l l42" x="18" y="894" xml:space="preserve" fill="#d7dae0">a value. To have it set next time, run this yourself:</text>
    <text class="l l43" x="18" y="914" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l44" x="18" y="934" xml:space="preserve" fill="#d7dae0">  read -rs -p &quot;API key: &quot; ANTHROPIC_API_KEY &amp;&amp; export ANTHROPIC_API_KEY</text>
    <text class="l l45" x="18" y="954" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l46" x="18" y="974" xml:space="preserve" fill="#d7dae0">[7/7] first build</text>
    <text class="l l47" x="18" y="994" xml:space="preserve" fill="#3fb950">✓ test passed        0.1s</text>
    <text class="l l48" x="18" y="1014" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l49" x="18" y="1034" xml:space="preserve" fill="#3fb950">✓ every required gate passed.</text>
    <text class="l l50" x="18" y="1054" xml:space="preserve" fill="#d7dae0">Evidence: .wringer/runs/20260807-110842-36e4/</text>
    <text class="l l51" x="18" y="1074" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l52" x="18" y="1094" xml:space="preserve" fill="#d7dae0">Receipt:  .wringer/attestations/20260807-110842-d6db/attestation.json</text>
    <text class="l l53" x="18" y="1114" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l54" x="18" y="1134" xml:space="preserve" fill="#d7dae0">! unsigned — this proves the named bundles are unaltered since they were</text>
    <text class="l l55" x="18" y="1154" xml:space="preserve" fill="#d7dae0">  written, not who produced them, and not that they were not fabricated</text>
    <text class="l l56" x="18" y="1174" xml:space="preserve" fill="#d7dae0">  wholesale.</text>
    <text class="l l57" x="18" y="1194" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l58" x="18" y="1214" xml:space="preserve" fill="#d7dae0">Check it yourself — offline, no config, no network:</text>
    <text class="l l59" x="18" y="1234" xml:space="preserve" fill="#d7dae0">  wring audit .wringer/attestations/20260807-110842-d6db/attestation.json</text>
  </g>
