# `wring verify` as a Kubernetes Job.
#
# One verification of a repository that already exists on a volume, writing
# its evidence bundle back to that volume. This is the smallest useful shape,
# not a template with every knob exposed — read the comments before applying
# it, because two of them are about what a gate is allowed to do to your
# cluster.
#
#   kubectl apply -f deploy/k8s-job.yaml
#   kubectl logs -f job/wring-verify
#
# Full walkthrough, including the Apple-container and Docker paths:
# docs/deployment.md
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wring-verify
  labels:
    app.kubernetes.io/name: wringer
    app.kubernetes.io/component: verify
spec:
  # A failing gate is an answer, not a flake. Retrying it burns the cluster's
  # time and writes a second bundle that says the same thing. Exit codes
  # reach the Job unchanged: 0 all required gates passed, 1 a required gate
  # failed, 2 config or environment error, 3 refused, 4 interrupted. A Failed
  # Job here is usually a real verdict about the code, not a broken cluster.
  backoffLimit: 0

  # The outer bound. The inner one is each gate's `timeout:` in
  # .wringer.yaml, which is what actually kills a runaway gate and records it
  # in the bundle as a timeout rather than as a vanished pod.
  activeDeadlineSeconds: 1800

  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app.kubernetes.io/name: wringer
    spec:
      restartPolicy: Never

      # A gate is an arbitrary shell command out of the repository's
      # .wringer.yaml, run with this pod's privileges. Do not hand it a
      # credential that can talk to the API server.
      automountServiceAccountToken: false

      # The gate also has this pod's network. If your gates do not need to
      # reach anything, add a deny-all NetworkPolicy selecting this label —
      # many test suites do need the network, which is why it is not assumed
      # here either way.

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # The evidence bundle is written into the workspace, so the volume
        # has to be writable by this GID. If the checkout on the volume is
        # owned by some other UID, git refuses to read it — see the
        # GIT_CONFIG_* variables below.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: wring
          # Pin a tag you chose. `:latest` follows main, and proving a change
          # against a moving harness is not proof; a digest (@sha256:...) is
          # better still.
          #
          # This image ships Wringer and no coding agent — by decision.
          # It is also not a build environment for your repo: a gate that
          # runs `pytest -q` needs pytest present, so either build your own
          # image FROM this one with your toolchain added, or make the first
          # gate the one that installs it.
          image: ghcr.io/marcoakes/wringer:0.2.0
          imagePullPolicy: IfNotPresent

          command: ["wring"]
          args: ["verify"]  # add "--json" when something machine-readable consumes this

          workingDir: /workspace

          env:
            # `wring verify` makes no network call and needs no API key. This
            # is wired up anyway because it is the same Job you extend to
            # `wring run` or `wring judge --send`, and because it shows the
            # only correct way to get a key in: by reference, never inline.
            #
            # Create the Secret out of band — from a file you delete
            # afterwards, or through your cluster's secret manager. Never
            # paste the value into this manifest, and never hand it to a
            # coding agent to set up for you.
            #
            # Wringer builds its redactor from the environment before it
            # writes anything, so the value of a variable whose name matches
            # *TOKEN*, *SECRET* or *KEY* — plus whatever exact name
            # `judge.api_key_env` gives — is replaced with [REDACTED] in gate
            # logs, diff.patch, status.txt, recorded commands and
            # evidence.jsonl. Naming it something without KEY in it opts you
            # out of the default half of that protection.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wring-api-key
                  key: api-key
                  # verify does not need it, so a missing Secret is not a
                  # reason to fail the Job. Remove this line once something
                  # in the Job actually requires the key.
                  optional: true

            # readOnlyRootFilesystem means git has nowhere to put a global
            # config; point HOME at the writable tmpfs below.
            - name: HOME
              value: /tmp

            # git refuses to operate on a repository owned by another UID
            # ("detected dubious ownership in repository"). This is the
            # read-only-rootfs way to allow it. The alternative is to make
            # the volume's contents owned by runAsUser above.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /workspace

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # Your gates run inside these. A test suite killed for
              # exceeding the memory limit fails its gate, and the bundle
              # will show an OOM rather than a bug — size this for the suite,
              # not for `wring`, which needs almost none of it.
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp

      volumes:
        # The repository, checked out *with its .git directory*.
        # `wring verify` refuses to run outside a git repo (exit 2), and the
        # manifest's SHA, the git.status event, diff.patch and status.txt all
        # come from git — a bundle without them cannot say what was verified.
        #
        # Populate the claim however you like: a clone in an initContainer, a
        # CI step that stages the working copy, or a volume you already keep
        # checkouts on. It must be read-write: the bundle is written to
        # .wringer/runs/<run_id>/ inside it, and git needs to refresh its
        # index during `status`.
        - name: workspace
          persistentVolumeClaim:
            claimName: wring-workspace

        - name: tmp
          emptyDir: {}
