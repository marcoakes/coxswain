[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wringer"
version = "0.1.0"
description = "One command that proves whether this change is mergeable — wring verify, a standalone evidence compiler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marc Oakes" }]
keywords = ["ai-dlc", "verification", "evidence", "gates", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
wring = "wringer.cli:main"
wringer = "wringer.cli:main"

[project.urls]
Homepage = "https://github.com/marcoakes/wringer"
Repository = "https://github.com/marcoakes/wringer"
Roadmap = "https://github.com/marcoakes/wringer/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear — the checks that
# catch real mistakes. This is the gate Wringer's own .wringer.yaml declares.
select = ["E", "F", "W", "I", "UP", "B"]
