[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coxswain"
version = "0.1.0.dev0"
description = "One command that proves whether this change is mergeable — cox verify, a standalone evidence compiler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marc Oakes" }]
keywords = ["ai-dlc", "verification", "evidence", "gates", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cox = "cox.cli:main"

[project.urls]
Homepage = "https://github.com/marcoakes/coxswain"
Repository = "https://github.com/marcoakes/coxswain"
Roadmap = "https://github.com/marcoakes/coxswain/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
